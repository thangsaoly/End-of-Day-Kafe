server:
  port: 8082

spring:
  datasource:
    url: jdbc:mysql://localhost:3307/end_of_day_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: kafe_user
    password: kafe_password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

app:
  # Local development only: this email becomes the merchant of the first cafe on first sign-in
  dev-merchant-email: ${DEV_MERCHANT_EMAIL:}
  firebase:
    # Not secret: used to check that ID tokens were issued for this project
    project-id: ${FIREBASE_PROJECT_ID:end-of-day-kafe}
    # Path to the Firebase Admin service-account JSON. Keep the file outside the repo
    # and set FIREBASE_CREDENTIALS. When empty, push notifications are logged instead of sent.
    credentials-path: ${FIREBASE_CREDENTIALS:}
